name: Validate dashboard

on:
  pull_request:
  push:
    branches: [main, agent/cd-dashboard-v3]

permissions:
  contents: read

jobs:
  model-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate model and report round trips
        run: node scripts/validate-model.mjs
